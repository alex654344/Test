
name: Diagnose Docker Crash

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test base Python image
        run: |
          docker run --rm python:3.12-slim \
            python -c "print('Base Python OK')"

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: testy:latest

      - name: Check Python and dependencies
        run: |
          docker run --rm --entrypoint python testy:latest \
            -c "import sys; print(sys.version); print('Python OK')"

          docker run --rm --entrypoint python testy:latest \
            -c "from cryptography.fernet import Fernet; print('Cryptography OK')"

      - name: Check RandomX libraries
        run: |
          docker run --rm --entrypoint /bin/sh testy:latest -c \
            'ldconfig -p | grep -i randomx || true'

      - name: Run application and capture logs
        shell: bash
        run: |
          set +e
          docker run --name testy-debug testy:latest
          result=$?

          docker logs testy-debug 2>&1 || true
          docker inspect testy-debug \
            --format='ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' \
            || true

          docker rm -f testy-debug >/dev/null 2>&1 || true
          echo "Application exit code: $result"
          exit "$result"
