
name: Build and Run Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: testy:latest

      - name: Run container once and capture logs
        shell: bash
        run: |
          set +e

          docker run --name testy-container testy:latest
          result=$?

          echo "Container exit code: $result"
          echo "========== Container logs =========="
          docker logs testy-container 2>&1 || true

          echo "========== Container state =========="
          docker inspect testy-container \
            --format='ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' \
            || true

          docker rm -f testy-container >/dev/null 2>&1 || true

          exit "$result"
