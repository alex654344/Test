
name: Docker Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: testy:latest

      - name: Run container once
        run: docker run --rm testy:latest

      - name: Wait 5 hours
        run: sleep 18000
